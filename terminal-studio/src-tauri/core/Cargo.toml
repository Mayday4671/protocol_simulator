[package]
name = "simterm-core"
version = "0.1.0"
edition = "2021"
description = "多协议 UDP 终端模拟系统 - 核心逻辑库（无 GUI 依赖, 可独立测试）"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
pulldown-cmark = "0.13"
regex = "1"
thiserror = "2"
chrono = "0.4"
rand = "0.8"
hex = "0.4"
roxmltree = "0.20"
dashmap = "6"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
